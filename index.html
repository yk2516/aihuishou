<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二手手机搜索 · 转转 / 爱回收</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232b6cff'/%3E%3Ctext x='16' y='23' font-size='17' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E4%BA%8C%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1a1d23;--sub:#858c99;--line:#e8ebf0;--blue:#2b6cff;--blue2:#6398ff;--price:#e74449;--zz:#e8352e;--ahs:#0b7fd4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{width:min(1080px,100%);margin:auto;padding:16px 18px 56px}
.top{position:sticky;top:0;z-index:5;margin:-16px -18px 17px;padding:16px 18px 13px;background:rgba(245,246,248,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.title h1{font-size:20px;margin:0;font-weight:700}
.counter{margin-left:auto;color:var(--sub);font-size:13px}
.counter b{color:var(--text);font-size:16px}
.source-url{color:#a2a8b2;font-size:11px;margin-top:5px}
.switch{display:inline-flex;gap:4px;padding:3px;background:#eceef3;border-radius:10px}
.switch button{border:0;background:transparent;color:#5b6472;font-size:13px;font-weight:650;padding:6px 14px;border-radius:8px;cursor:pointer}
.switch button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(20,25,40,.14)}
.search{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.search input{flex:1;min-width:150px;border:1px solid #dde2ea;border-radius:10px;padding:10px 13px;background:#fff;color:var(--text);outline:0;font-size:14px}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(43,108,255,.12)}
.pages{display:flex;align-items:center;gap:5px;padding:0 10px;border:1px solid #dde2ea;border-radius:10px;background:#fff;color:var(--sub);font-size:13px}
.pages input{width:40px;border:0;padding:9px 0;text-align:center;box-shadow:none;min-width:0}
.btn{border-radius:10px;padding:9px 17px;font-weight:650;white-space:nowrap;font-size:14px;cursor:pointer}
.primary{border:0;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 3px 9px rgba(43,108,255,.24)}
.ghost{border:1px solid #dde2ea;background:#fff;color:#596476}
.status{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:13px;margin:12px 0}
.dot{width:8px;height:8px;border-radius:50%;background:#1dae74;box-shadow:0 0 0 4px rgba(29,174,116,.12);flex:none}
.dot.busy{background:#f0a020;box-shadow:0 0 0 4px rgba(240,160,32,.15);animation:pulse 1s infinite}
.dot.err{background:#e74449;box-shadow:0 0 0 4px rgba(231,68,73,.14)}
@keyframes pulse{50%{opacity:.45}}
.bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 12px;padding:10px 13px;background:#fff;border:1px solid var(--line);border-radius:12px}
.bar .label{color:var(--sub);font-size:13px}
.sort{border:1px solid #dde2ea;background:#fff;color:#4a5464;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.sort.active{border-color:var(--blue);background:#eef3ff;color:var(--blue);font-weight:650}
.sort em{font-style:normal;margin-left:2px}
.filter{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.filter-head{display:flex;align-items:center;gap:8px;padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer;user-select:none}
.filter-head .chev{margin-left:auto;color:var(--sub);transition:transform .2s}
.filter.open .chev{transform:rotate(180deg)}
.selected-count{font-size:12px;font-weight:400;color:#fff;background:var(--blue);border-radius:999px;padding:2px 8px;display:none}
.selected-count.show{display:inline-block}
.filter-body{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.filter.open .filter-body{display:block}
.group{display:flex;gap:10px;align-items:flex-start;padding:9px 0}
.group+.group{border-top:1px dashed #eef0f4}
.group-name{flex:none;width:62px;color:var(--sub);font-size:13px;padding-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #dde2ea;background:#fff;color:#4a5464;border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer}
.chip.on{border-color:var(--blue);background:var(--blue);color:#fff;font-weight:600}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.thumb{width:92px;height:92px;flex:none;object-fit:cover;border-radius:10px;background:#f0f2f5;border:1px solid #eef0f4}
.card .body{flex:1;min-width:0}
.head{display:flex;align-items:flex-start;gap:8px}
.idx{flex:none;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;background:#eef3ff;color:var(--blue);font-size:12px;font-weight:700}
.name{flex:1;font-size:14px;font-weight:650;line-height:1.45;word-break:break-word}
.priceline{flex:none;text-align:right;white-space:nowrap}
.price{color:var(--price);font-size:19px;font-weight:750}
.price small{font-size:12px;font-weight:600}
.orig{display:block;color:#a8aeb8;font-size:11.5px;text-decoration:line-through;margin-top:1px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:11.5px;border-radius:6px;padding:3px 8px;background:#f4f5f8;color:#5b6472}
.tag.blue{background:#eef3ff;color:#2b6cff}
.tag.green{background:#e9f7f0;color:#1a9e6a}
.tag.orange{background:#fef2e4;color:#c07215}
.tag.red{background:#fdecec;color:#d63a3a}
.tag.cyan{background:#e7f5fd;color:#0b7fd4}
.foot{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:11.5px;color:#a2a8b2}
.open{margin-left:auto;color:var(--blue);text-decoration:none;font-weight:600;font-size:12.5px}
.empty{text-align:center;color:var(--sub);padding:48px 16px;font-size:14px;line-height:2}
.empty b{display:block;font-size:30px;color:#c9d0da}
.empty small{font-size:12.5px}
.end{text-align:center;color:#b6bcc6;font-size:12px;padding:18px 0}
@media(max-width:560px){.thumb{width:74px;height:74px}.price{font-size:17px}.name{font-size:13px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top">
<div class="title"><h1 id="pageTitle">二手手机搜索</h1>
<div class="switch" id="switch"><button data-src="zz" class="on">转转</button><button data-src="ahs">爱回收</button></div>
<span class="counter">已加载 <b id="count">0</b> 条</span></div>
<div class="source-url" id="sourceUrl">数据源：转转开放平台 · 含系统版本 / 电池健康 / 质检信息</div>
<form class="search" id="searchForm"><input id="kw" name="kw" placeholder="输入型号，如 iPhone 15 Pro Max" autocomplete="off"><label class="pages"><span id="pagesLabel">页数</span><input id="pages" type="number" min="1" max="3" value="1"></label><button class="btn primary">搜索</button><button class="btn ghost" type="button" id="reset">重置</button></form>
</header>
<div class="status"><i class="dot" id="dot"></i><span id="status">输入型号后点击搜索</span></div>
<div class="bar"><span class="label">排序：</span><span id="sortBar"></span></div>
<section class="filter" id="filter"><div class="filter-head">筛选条件 <span class="selected-count" id="selectedCount">0 项</span><span class="chev">⌄</span></div><div class="filter-body" id="filterBody"></div></section>
<section class="list" id="list"></section><div class="end" id="end"></div>
</main>
<script>
const SORTS={
  zz:[['default','默认'],['price','价格'],['memory','内存'],['system','系统'],['cycles','充电次数'],['battery','电池健康']],
  ahs:[['default','默认'],['price','价格'],['memory','内存'],['system','系统'],['cycles','充电次数'],['battery','电池健康']]
};
const ZZ_STATIC={'型号':['iPhone 15','iPhone 14','iPhone 13','iPhone 12','iPhone 11','iPad','华为','小米'],'电池健康':['90%及以上','85%-89%','80%-84%','80%以下'],'维修情况':['功能完好无换修','有维修记录']};
const CYCLE_BUCKETS=['0次','1-300次','300-800次','800-1500次','1500次以上'];
const AHS_STATIC={'电池健康':['100%','95%-99%','90%-95%','85%-90%','80%-85%'],'充电次数':CYCLE_BUCKETS,'维修情况':['无换修无异常','有功能异常','有换修记录']};
const st={source:'zz',rows:[],sort:'default',dir:0,filters:new Set(),kw:'',groups:[],brands:[],poolSize:0,condTotal:0,condDone:0,condSig:'',poolLoading:false};
let reqId=0, shown=60;
const PAGE=60;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function priceNum(s){const n=Number(String(s??'').replace(/[^\d.]/g,''));return Number.isFinite(n)&&String(s??'').trim()!==''?n:null}
function versionNum(s){const m=String(s||'').match(/\d+(?:\.\d+)*/);return m?m[0].split('.').map(Number):[0]}
function arrCmp(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0}
function memNum(row){const src=String(row.memory||row.nick||'');const m=src.match(/(\d+)\s*(TB|GB|G|T)\b/i);if(!m)return 0;return /T/i.test(m[2])?Number(m[1])*1024:Number(m[1])}
function scoreNum(row){const m=String(row.score||'').match(/\d+/);return m?Number(m[0]):0}
function condOf(row){return (row&&row.cond)||null}
function batteryLevelOf(row){
  if(st.source!=='ahs')return '';
  const c=condOf(row);
  return (c&&c.battery)||row.battery||'';
}
function cycleNum(row){
  let raw;
  if(st.source==='ahs'){const c=condOf(row);raw=c?c.cycles:'';}
  else raw=row.dian;
  const digits=String(raw==null?'':raw).replace(/[^\d]/g,'');
  if(!digits)return null;
  const n=Number(digits);
  return Number.isFinite(n)?n:null;
}
function cycleBucket(n){
  if(n===null||n===undefined)return '';
  if(n===0)return '0次';
  if(n<=300)return '1-300次';
  if(n<=800)return '300-800次';
  if(n<=1500)return '800-1500次';
  return '1500次以上';
}
function batLevelNum(v){const m=String(v||'').match(/(\d{2,3})/);return m?Number(m[1]):0}
function batteryNum(row){
  if(st.source==='ahs'){const m=String(batteryLevelOf(row)).match(/(\d{2,3})/);return m?Number(m[1]):null}
  const t=[row.gong,row.gong1].join(' ');const m=t.match(/(\d{2,3})%/);return m?Number(m[1]):null;
}
function batteryLevel(b){return b===null?null:b>=90?'90%及以上':b>=85?'85%-89%':b>=80?'80%-84%':'80%以下'}
function uniqSort(arr,key){return Array.from(new Set(arr.filter(Boolean))).sort(key)}
function buildGroups(){
  if(st.source==='ahs'){
    const out=[];
    const brandNames=uniqSort(st.rows.map(r=>r.brand),(a,b)=>a.localeCompare(b,'zh'));
    if(brandNames.length)out.push(['品牌',brandNames]);
    const sys=uniqSort(st.rows.map(r=>(condOf(r)||{}).system),(a,b)=>arrCmp(versionNum(b),versionNum(a)));
    if(sys.length)out.push(['系统版本',sys.slice(0,24)]);
    out.push(['充电次数',CYCLE_BUCKETS]);
    const bat=uniqSort(st.rows.map(batteryLevelOf),(a,b)=>batLevelNum(b)-batLevelNum(a));
    out.push(['电池健康',bat.length?bat:AHS_STATIC['电池健康']]);
    const mem=uniqSort(st.rows.map(r=>r.memory),(a,b)=>memNum({memory:a})-memNum({memory:b}));
    if(mem.length)out.push(['内存',mem]);
    const cond=uniqSort(st.rows.map(r=>r.score),(a,b)=>scoreNum({score:b})-scoreNum({score:a}));
    if(cond.length)out.push(['成色',cond]);
    const scr=uniqSort(st.rows.map(r=>r.screen),(a,b)=>a.localeCompare(b,'zh'));
    if(scr.length)out.push(['屏幕',scr]);
    const sh=uniqSort(st.rows.map(r=>r.shell),(a,b)=>a.localeCompare(b,'zh'));
    if(sh.length)out.push(['外壳',sh]);
    const fn=uniqSort(st.rows.map(r=>r.func),(a,b)=>a.localeCompare(b,'zh'));
    if(fn.length)out.push(['功能',fn]);
    const wt=uniqSort(st.rows.map(r=>r.warranty),(a,b)=>a.localeCompare(b,'zh'));
    if(wt.length)out.push(['保修',wt]);
    out.push(['维修情况',AHS_STATIC['维修情况']]);
    return out;
  }
  const out=[['型号',ZZ_STATIC['型号']]];
  const mem=[],sys=[],cond=[];const sm=new Set(),ss=new Set(),sc=new Set();
  st.rows.forEach(r=>{
    const mt=String(r.memory||'').toUpperCase()||((String(r.nick||'').match(/(\d+)\s*(?:GB|TB)/i)||[])[0]||'').toUpperCase();
    if(mt&&!sm.has(mt)){sm.add(mt);mem.push(mt)}
    const sv=String(r.report||'').match(/^(iOS)\s*(\d+)/i);
    if(sv){const v='iOS '+sv[2];if(!ss.has(v)){ss.add(v);sys.push(v)}}
    if(r.score&&!sc.has(r.score)){sc.add(r.score);cond.push(r.score)}
  });
  mem.sort((a,b)=>memNum({memory:a})-memNum({memory:b}));
  sys.sort((a,b)=>arrCmp(versionNum(a),versionNum(b)));
  cond.sort((a,b)=>scoreNum({score:b})-scoreNum({score:a}));
  if(mem.length)out.push(['内存',mem]);
  if(sys.length)out.push(['系统',sys]);
  if(cond.length)out.push(['成色',cond]);
  out.push(['电池健康',ZZ_STATIC['电池健康']]);
  out.push(['维修情况',ZZ_STATIC['维修情况']]);
  return out;
}
function matches(row,g,v){
  if(g==='型号')return String(row.nick||'').toLowerCase().includes(v.toLowerCase());
  if(g==='品牌')return String(row.brand||'')===v;
  if(g==='内存')return memNum(row)===memNum({memory:v});
  if(g==='系统')return String(row.report||'').toLowerCase().startsWith(v.toLowerCase());
  if(g==='系统版本')return String((condOf(row)||{}).system||'')===v;
  if(g==='充电次数'){const n=cycleNum(row);return n===null?false:cycleBucket(n)===v}
  if(g==='成色')return String(row.score||'').trim()===v;
  if(g==='屏幕')return String(row.screen||'')===v;
  if(g==='外壳')return String(row.shell||'')===v;
  if(g==='功能')return String(row.func||'')===v;
  if(g==='保修')return String(row.warranty||'')===v;
  if(g==='电池健康'){
    if(st.source==='ahs')return batteryLevelOf(row)===v;
    const b=batteryNum(row);return b===null?false:batteryLevel(b)===v;
  }
  if(g==='维修情况'){
    if(v==='无换修无异常')return row.repairFlag==='clean'&&!row.funcIssue;
    if(v==='有功能异常')return !!row.funcIssue;
    if(v==='有换修记录'||v==='有维修记录')return row.repairFlag!=='clean';
    return v==='功能完好无换修'?row.repairFlag==='clean':row.repairFlag!=='clean';
  }
  return true;
}
function rows(){
  let r=st.rows.slice();
  st.groups.forEach(([g,vs])=>{
    const chosen=vs.filter(v=>st.filters.has(g+'='+v));
    if(chosen.length)r=r.filter(x=>chosen.some(v=>matches(x,g,v)));
  });
  if(st.sort!=='default'&&st.dir){
    const get={
      price:x=>priceNum(x.price),
      orig:x=>priceNum(x.orig),
      system:x=>{const v=(condOf(x)||{}).system||x.report;return v?versionNum(v):null},
      memory:x=>memNum(x)||null,
      cycles:x=>cycleNum(x),
      battery:x=>batteryNum(x),
      score:x=>scoreNum(x)||null
    }[st.sort];
    // 缺数据的条目无论升序降序都排最后，避免「升序时全是没数据的机型」
    const norm=v=>(v===null||v===undefined||(Array.isArray(v)&&v.length===0))?null:v;
    r=r.map((x,i)=>({...x,__i:i})).sort((a,b)=>{
      const av=norm(get(a)),bv=norm(get(b));
      if(av===null&&bv===null)return a.__i-b.__i;
      if(av===null)return 1;
      if(bv===null)return -1;
      const c=Array.isArray(av)?arrCmp(av,bv):(av-bv);
      return c?c*st.dir:a.__i-b.__i;
    });
  }
  return r;
}
function tagClass(t){return /iOS|外观|整机/.test(t)?'blue':/电池|充电|保修|质保|在保/.test(t)?'green':/划痕|换|磕碰|异常|维修|掉漆|第三方/.test(t)?'red':'orange'}
function renderFilters(){
  st.groups=buildGroups();
  const body=$('#filterBody');
  body.innerHTML=st.groups.map(([g,vs])=>`<div class="group"><span class="group-name">${esc(g)}</span><div class="chips">${vs.map(v=>`<button class="chip ${st.filters.has(g+'='+v)?'on':''}" data-g="${esc(g)}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div></div>`).join('');
  body.querySelectorAll('.chip').forEach(b=>{b.onclick=()=>{const k=b.dataset.g+'='+b.dataset.v;if(st.filters.has(k))st.filters.delete(k);else st.filters.add(k);shown=PAGE;renderFilters();render()}});
  const n=st.filters.size;
  $('#selectedCount').textContent=n+' 项';
  $('#selectedCount').classList.toggle('show',n>0);
}
function renderSortBar(){
  $('#sortBar').innerHTML=SORTS[st.source].map(([k,label])=>`<button class="sort" data-sort="${k}">${label} <em></em></button>`).join(' ');
  document.querySelectorAll('.sort').forEach(b=>b.onclick=()=>{const k=b.dataset.sort;if(k==='default'){st.sort='default';st.dir=0}else if(st.sort!==k){st.sort=k;st.dir=1}else st.dir=st.dir===1?-1:1;shown=PAGE;render()});
}
function cardTags(d){
  const tags=[];
  const c=condOf(d);
  if(d.score)tags.push(`<span class="tag orange">成色 ${esc(d.score)}</span>`);
  if(d.memory)tags.push(`<span class="tag">${esc(d.memory)}</span>`);
  else if(memNum(d))tags.push(`<span class="tag">${memNum(d)}G</span>`);
  if(c&&c.system)tags.push(`<span class="tag blue">系统 ${esc(c.system)}</span>`);
  else if(d.report)tags.push(`<span class="tag blue">${esc(d.report)}</span>`);
  if(c&&String(c.cycles||'')!=='')tags.push(`<span class="tag">充电${esc(c.cycles)}次</span>`);
  if(d.gong)tags.push(`<span class="tag ${/第三方/.test(d.gong)?'red':'green'}">${esc(d.gong)}</span>`);
  else if(c&&c.battery)tags.push(`<span class="tag green">电池健康${esc(c.battery)}</span>`);
  if(c&&c.warranty&&!/过保/.test(c.warranty))tags.push(`<span class="tag green">${esc(c.warranty)}</span>`);
  if(d.dian)tags.push(`<span class="tag green">${esc(d.dian)}</span>`);
  if(d.ji)tags.push(`<span class="tag">${esc(d.ji)}</span>`);
  if(d.wan)tags.push(`<span class="tag ${tagClass(d.wan)}">${esc(d.wan)}</span>`);
  if(d.funcIssue)tags.push(`<span class="tag red">功能·${esc(d.funcIssue)}</span>`);
  if(d.gong1&&d.gong1!=='功能完好无换修'&&d.gong1!==`功能·${d.funcIssue}`)tags.push(`<span class="tag red">${esc(d.gong1)}</span>`);
  if(d.promotion)tags.push(`<span class="tag red">${esc(d.promotion)}</span>`);
  if(Array.isArray(d.labels))d.labels.slice(0,3).forEach(t=>{if(!/电池|功能完好/.test(t))tags.push(`<span class="tag cyan">${esc(t)}</span>`)});
  return tags;
}
function render(){
  const r=rows();
  $('#count').textContent=r.length;
  const srcName=st.source==='ahs'?'爱回收严选':'转转官方';
  let condNote='';
  if(st.source==='ahs'&&st.rows.length){
    if(st.poolLoading)condNote=' · 正在补充更多…';
    else if(st.condTotal&&st.condDone<st.condTotal)condNote=` · 核心机况补充中 ${Math.round(st.condDone/st.condTotal*100)}%`;
    else if(st.condTotal)condNote=' · 核心机况已补全';
  }
  if(st.kw)$('#status').textContent=`搜索“${st.kw}”完成，共 ${r.length} 条 · ${srcName}实时数据${condNote}`;
  else if(st.source==='ahs'&&st.rows.length)$('#status').textContent=`已加载 ${r.length} 条 · 商品池 ${st.poolSize} 条 · ${srcName}实时数据${condNote}`;
  else $('#status').textContent=st.source==='ahs'?'可直接浏览，或输入型号筛选':'输入型号后点击搜索';
  const view=r.slice(0,shown);
  $('#list').innerHTML=view.length?view.map((d,i)=>{
    const tags=cardTags(d);
    const priceLine=`<span class="priceline"><span class="price"><small>￥</small>${esc(String(d.price??'暂无'))}</span>${d.orig&&priceNum(d.orig)?`<span class="orig">￥${esc(String(d.orig))}</span>`:''}</span>`;
    return `<article class="card">${d.img?`<img class="thumb" src="${esc(d.img)}" loading="lazy" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}<div class="body"><div class="head"><span class="idx">${i+1}</span><span class="name">${esc(d.nick||'未命名商品')}</span>${priceLine}</div><div class="tags">${tags.join('')}</div><div class="foot"><span>${esc(d.brand||'')}${d.brand?' · ':''}${srcName}官方接口</span>${d.url?`<a class="open" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">${st.source==='ahs'?'查看商品 ↗':'打开商品 ↗'}</a>`:''}</div></div></article>`;
  }).join(''):`<div class="empty"><b>⌕</b>暂无符合条件的结果<br><small>请调整型号或筛选条件</small></div>`;
  if(r.length>shown){
    $('#end').innerHTML=`<button class="btn ghost" id="more">显示更多 · 还有 ${r.length-shown} 条</button>`;
    $('#more').onclick=()=>{shown+=PAGE;render()};
  }else{
    $('#end').textContent=r.length?'—— 共 '+r.length+' 条 ——':'';
  }
  document.querySelectorAll('.sort').forEach(b=>{b.classList.toggle('active',b.dataset.sort===st.sort);const e=b.querySelector('em');if(e)e.textContent=b.dataset.sort===st.sort&&st.dir?(st.dir===1?'↑':'↓'):''});
}
function applySource(){
  const ahs=st.source==='ahs';
  document.querySelectorAll('#switch button').forEach(b=>b.classList.toggle('on',b.dataset.src===st.source));
  $('#pageTitle').textContent=ahs?'爱回收严选二手手机':'转转二手手机搜索';
  $('#sourceUrl').textContent=ahs?'数据源：爱回收严选（m.aihuishou.com）· 核心机况：系统版本 / 充电次数 / 电池效率 / 保修，另含屏幕 / 外壳 / 功能质检明细':'数据源：转转开放平台 · 含系统版本 / 电池健康 / 质检信息';
  $('#kw').placeholder=ahs?'可留空浏览全部，或输入型号如 iPhone 15':'输入型号，如 iPhone 15 Pro Max';
  $('#pagesLabel').textContent=ahs?'深度':'页数';
  $('#pages').max=ahs?6:3;
  $('#pages').value=ahs?3:1;
  renderSortBar();
}
async function mapLimitLocal(list,limit,worker){
  let cursor=0;
  const runners=new Array(Math.min(limit,list.length||1)).fill(null).map(async()=>{
    for(;;){const i=cursor++;if(i>=list.length)return;await worker(list[i],i)}
  });
  await Promise.all(runners);
}
let enrichToken=0;
async function enrich(my){
  const token=++enrichToken;
  const seen=new Set(),ids=[];
  st.rows.forEach(r=>{const g=r.goodsNo;if(g&&!seen.has(g)){seen.add(g);ids.push(g)}});
  if(!ids.length){st.condTotal=0;st.condDone=0;return}
  const batches=[];
  for(let i=0;i<ids.length;i+=45)batches.push(ids.slice(i,i+45));
  st.condTotal=ids.length;st.condDone=0;
  const alive=()=>my===reqId&&st.source==='ahs'&&token===enrichToken;
  await mapLimitLocal(batches,4,async b=>{
    if(!alive())return;
    try{
      const res=await fetch(`/api/ahs?cond=1&ids=${encodeURIComponent(b.join(','))}`);
      const data=await res.json();
      const items=data.items||{};
      st.rows.forEach(r=>{const c=items[r.goodsNo];if(c)r.cond=c});
    }catch(_){}
    if(!alive())return;
    st.condDone+=b.length;
    const sig=st.rows.map(r=>(condOf(r)||{}).system).filter(Boolean).sort().join('|');
    if(sig!==st.condSig){st.condSig=sig;renderFilters()}
    render();
  });
  if(!alive())return;
  st.condDone=st.condTotal;
  renderFilters();render();
}
async function search(){
  const kw=$('#kw').value.trim();
  if(st.source==='zz'&&!kw){$('#status').textContent='请先输入型号，例如 iPhone 15';$('#dot').classList.add('err');return}
  st.kw=kw;
  const pages=Math.max(1,Math.min(st.source==='ahs'?6:3,Number($('#pages').value)||1));
  const my=++reqId;
  $('#dot').classList.remove('err');$('#dot').classList.add('busy');
  $('#status').textContent=st.source==='ahs'?'正在从爱回收聚合实时在售商品…':'正在从转转获取实时数据…';
  try{
    if(st.source==='ahs'){
      const qs=k=>`/api/ahs?pages=${k}${kw?`&kw=${encodeURIComponent(kw)}`:''}`;
      // 第一段：轻量首屏，秒出内容
      const first=await fetch(qs(1)).then(r=>r.json());
      if(my!==reqId||st.source!=='ahs')return;
      if(first.error)throw new Error(first.error);
      st.rows=first.items||[];st.sort='default';st.dir=0;st.filters.clear();shown=PAGE;
      st.poolSize=first.poolSize||st.rows.length;
      st.condTotal=0;st.condDone=0;st.condSig='';
      renderFilters();render();
      if(pages>1){
        st.poolLoading=true;render();
        // 第二段：后台补齐深度，服务端只补差量
        const full=await fetch(qs(pages)).then(r=>r.json());
        if(my!==reqId||st.source!=='ahs')return;
        st.poolLoading=false;
        if(!full.error){
          st.rows=full.items||st.rows;st.poolSize=full.poolSize||st.poolSize;
        }
        renderFilters();render();
      }
      // 首屏已出，后台分批补核心机况（电池效率 / 充电次数 / 系统版本 / 保修）
      enrich(my);
      return;
    }
    const res=await fetch(`/api/search?kw=${encodeURIComponent(kw)}&pages=${pages}`);
    const data=await res.json();
    if(my!==reqId||st.source!=='zz')return;
    if(!res.ok)throw new Error(data.error||'请求失败');
    st.rows=data.items||[];st.sort='default';st.dir=0;st.filters.clear();shown=PAGE;
    st.poolSize=data.poolSize||st.rows.length;
    st.brands=data.brands||[];
    renderFilters();render();
    $('#status').textContent=`加载完成：${st.rows.length} 条 · ${data.pages||pages} 页 · 来源转转开放平台`;
  }catch(e){
    if(my!==reqId)return;
    st.rows=[];st.groups=[];shown=PAGE;render();
    $('#dot').classList.add('err');
    $('#status').textContent='获取失败：'+e.message+'；请稍后重试';
  }finally{if(my===reqId)$('#dot').classList.remove('busy')}
}
$('#searchForm').onsubmit=e=>{e.preventDefault();search()};
$('#reset').onclick=()=>{st.rows=[];st.kw='';st.sort='default';st.dir=0;st.filters.clear();st.poolSize=0;shown=PAGE;st.condTotal=0;st.condDone=0;st.condSig='';st.poolLoading=false;enrichToken++;$('#kw').value='';renderFilters();render();$('#dot').classList.remove('err');$('#status').textContent=st.source==='ahs'?'可直接浏览，或输入型号筛选':'输入型号后点击搜索'};
$('#filter .filter-head').onclick=()=>$('#filter').classList.toggle('open');
document.querySelectorAll('#switch button').forEach(b=>b.onclick=()=>{
  if(st.source===b.dataset.src)return;
  st.source=b.dataset.src;st.rows=[];st.kw='';st.sort='default';st.dir=0;st.filters.clear();st.poolSize=0;shown=PAGE;
  st.condTotal=0;st.condDone=0;st.condSig='';st.poolLoading=false;enrichToken++;
  $('#kw').value='';$('#dot').classList.remove('err');
  applySource();renderFilters();render();
  if(st.source==='ahs')search();
});
applySource();renderFilters();render();
</script>
</body></html>
