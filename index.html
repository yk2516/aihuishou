<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>转转二手手机搜索</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1a1d23;--sub:#858c99;--line:#e8ebf0;--blue:#2b6cff;--blue2:#6398ff;--price:#e74449}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}.wrap{width:min(1080px,100%);margin:auto;padding:16px 18px 56px}.top{position:sticky;top:0;z-index:5;margin:-16px -18px 17px;padding:16px 18px 13px;background:rgba(245,246,248,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.title h1{font-size:20px;margin:0;font-weight:700}.source{display:inline-flex;align-items:center;padding:6px 11px;border-radius:8px;background:linear-gradient(135deg,#e8352e,#ff6b5e);color:#fff;font-size:12px;font-weight:700}.counter{margin-left:auto;color:var(--sub);font-size:13px}.counter b{color:var(--text);font-size:16px}.source-url{color:#a2a8b2;font-size:11px;margin-left:4px}.search{display:flex;gap:8px;margin-top:12px}.search input{flex:1;min-width:0;border:1px solid #dde2ea;border-radius:10px;padding:10px 13px;background:#fff;color:var(--text);outline:0}.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(43,108,255,.12)}.pages{display:flex;align-items:center;gap:5px;padding:0 10px;border:1px solid #dde2ea;border-radius:10px;background:#fff;color:var(--sub);font-size:13px}.pages input{width:40px;border:0;padding:9px 0;text-align:center;box-shadow:none}.btn{border-radius:10px;padding:9px 17px;font-weight:650;white-space:nowrap}.primary{border:0;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 3px 9px rgba(43,108,255,.24)}.ghost{border:1px solid #dde2ea;background:#fff;color:#596476}.status{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:13px;margin:12px 0}.dot{width:8px;height:8px;border-radius:50%;background:#1dae74;box-shadow:0 0 0 4px rgba(29,174,116,.12)}.dot.busy{background:#f0a21b;box-shadow:0 0 0 4px rgba(240,162,27,.12)}.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.label{font-size:13px;color:var(--sub)}.sort{border:1px solid #dde2ea;border-radius:9px;padding:7px 11px;background:#fff;color:#4f5b6d;font-size:13px}.sort.active{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(43,108,255,.23)}.filter{border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:15px;overflow:hidden}.filter-head{padding:11px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:650}.filter-head .chev{margin-left:auto;color:#9da5b1}.filter.open .chev{transform:rotate(180deg)}.selected-count{display:none;padding:2px 7px;border-radius:6px;background:#eaf1ff;color:var(--blue);font-size:11px}.selected-count.show{display:inline-block}.filter-body{display:none;border-top:1px solid var(--line);padding:12px 14px 3px}.filter.open .filter-body{display:block}.group{display:grid;grid-template-columns:68px 1fr;gap:8px;margin-bottom:10px}.group-name{padding-top:6px;color:var(--sub);font-size:12px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid #e1e5ec;border-radius:8px;background:#fafbfd;color:#596476;padding:5px 9px;font-size:12px}.chip.on{border-color:#bdd0ff;background:#eaf1ff;color:var(--blue);font-weight:650}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid rgba(20,40,80,.05);border-radius:14px;padding:15px 16px;box-shadow:0 6px 20px rgba(20,40,80,.06);transition:.16s}.card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(20,40,80,.1)}.head{display:flex;align-items:flex-start;gap:9px}.idx{min-width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-size:12px;font-weight:700}.name{flex:1;font-weight:700;font-size:15px;line-height:1.45;word-break:break-all}.price{color:var(--price);font-weight:800;font-size:18px;white-space:nowrap}.price small{font-size:12px;margin-right:1px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0 0 36px}.tag{padding:4px 8px;border-radius:7px;background:#f4f6f9;border:1px solid #edf0f4;color:#506078;font-size:11px;white-space:nowrap}.tag.blue{background:#edf3ff;color:#2b67de;border-color:#dce8ff}.tag.green{background:#eaf9f2;color:#12845a;border-color:#d4f0e1}.tag.orange{background:#fff5e8;color:#b66c09;border-color:#ffe7c1}.tag.red{background:#fff0f0;color:#d33d42;border-color:#ffdada}.foot{display:flex;align-items:center;gap:8px;margin-top:13px;padding-top:11px;border-top:1px solid var(--line);color:var(--sub);font-size:11px}.open{margin-left:auto;color:var(--blue);background:#eef4ff;border-radius:8px;padding:6px 10px;text-decoration:none;font-size:12px;font-weight:650}.empty{text-align:center;grid-column:1/-1;color:var(--sub);padding:70px 20px}.empty b{display:block;font-size:36px;margin-bottom:10px;opacity:.45}.end{text-align:center;color:#a3aab5;font-size:12px;margin-top:22px}@media(max-width:720px){.wrap{padding-left:14px;padding-right:14px}.top{margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px}.list{grid-template-columns:1fr}.search{flex-wrap:wrap}.search input{flex:1 1 100%}.pages{flex:1;justify-content:center}.pages input{flex:1}.btn{flex:1}.tags{margin-left:0}.source-url{display:none}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="title"><h1>转转二手手机搜索</h1><span class="source">数据源：转转搜索</span><span class="counter">已加载 <b id="count">0</b> 条</span></div><div class="source-url">全部搜索请求来自 https://www.wxhbts.com/zz.php</div><form class="search" id="searchForm"><input id="kw" name="kw" placeholder="输入型号，如 iPhone 15 Pro Max" autocomplete="off"><label class="pages"><span>页数</span><input id="pages" type="number" min="1" max="50" value="1"></label><button class="btn primary">搜索</button><button class="btn ghost" type="button" id="reset">重置</button></form></header>
<div class="status"><i class="dot" id="dot"></i><span id="status">输入型号后点击搜索；结果由目标页面接口实时获取</span></div>
<div class="bar"><span class="label">排序：</span><button class="sort" data-sort="default">默认</button><button class="sort" data-sort="price">价格 <em></em></button><button class="sort" data-sort="system">系统 <em></em></button><button class="sort" data-sort="memory">内存 <em></em></button><button class="sort" data-sort="battery">电池健康 <em></em></button><button class="sort" data-sort="score">外观评分 <em></em></button></div>
<section class="filter" id="filter"><div class="filter-head">筛选条件 <span class="selected-count" id="selectedCount">0 项</span><span class="chev">⌄</span></div><div class="filter-body" id="filterBody"></div></section>
<section class="list" id="list"></section><div class="end" id="end"></div>
</main>
<script>
const groups=[['型号',['iPhone 15','iPhone 14','iPhone 13','iPhone 12','iPhone 11','iPad']],['内存',['64G','128G','256G','512G','1TB']],['系统',['iOS 18','iOS 17','iOS 16','iPadOS']],['成色',['99外观','95外观','9外观','9成新','8成新']],['电池健康',['90%及以上','85%-89%','80%-84%','80%以下']],['维修情况',['功能完好无换修','换电池','换屏','有维修']]];
const st={rows:[],sort:'default',dir:0,filters:new Set(),kw:''};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function version(s){return String(s||'').match(/\d+(?:\.\d+)*/)?.[0].split('.').map(Number)||[0]}
function arrCmp(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){let d=(a[i]||0)-(b[i]||0);if(d)return d}return 0}
function price(s){const n=Number(String(s||'').replace(/[^\d.]/g,''));return Number.isFinite(n)?n:null}
function memory(row){const m=String(row.nick||'').match(/(\d+)(?:G|GB|T|TB)/i);if(!m)return 0;return /T/i.test(m[0])?Number(m[1])*1024:Number(m[1])}
function score(row){const m=String(row.score||'').match(/\d+(?:\.\d+)?/);return m?Number(m[0]):0}
function battery(row){const text=[row.gong,row.gong1].join(' ');const m=text.match(/(\d{2,3})%/);return m?Number(m[1]):null}
function matches(row,g,v){const text=[row.nick,row.report,row.score,row.dian,row.ji,row.wan,row.wan1,row.gong,row.gong1].join(' ');if(g==='型号')return text.toLowerCase().includes(v.toLowerCase());if(g==='内存')return memory(row)===Number(v.replace(/[^\d]/g,''))*(/TB/i.test(v)?1024:1);if(g==='系统')return String(row.report||'').includes(v);if(g==='成色')return String(row.score||'').includes(v)||text.includes(v);if(g==='电池健康'){const b=battery(row);return b===null?false:v==='90%及以上'?b>=90:v==='85%-89%'?b>=85&&b<90:v==='80%-84%'?b>=80&&b<85:b<80}if(g==='维修情况')return v==='有维修'?/换|维修|异常/.test(text):text.includes(v);return true}
function rows(){let r=st.rows.slice();groups.forEach(([g,vs])=>{const chosen=vs.filter(v=>st.filters.has(g+'='+v));if(chosen.length)r=r.filter(x=>chosen.some(v=>matches(x,g,v)))});if(st.sort!=='default'&&st.dir){const get={price:r=>price(r.price),system:r=>version(r.report),memory:r=>memory(r),battery:r=>battery(r)??-1,score:r=>score(r)}[st.sort];r=r.map((x,i)=>({...x,__i:i})).sort((a,b)=>{const av=get(a),bv=get(b),c=Array.isArray(av)?arrCmp(av,bv):((av??-1)-(bv??-1));return c?c*st.dir:a.__i-b.__i})}return r}
function tagClass(t){return /iOS|外观/.test(t)?'blue':/电池|充电|保修/.test(t)?'green':/划痕|换|磕碰|异常/.test(t)?'red':'orange'}
function renderFilters(){const body=$('#filterBody');body.innerHTML=groups.map(([g,vs])=>`<div class="group"><span class="group-name">${g}</span><div class="chips">${vs.map(v=>`<button class="chip ${st.filters.has(g+'='+v)?'on':''}" data-g="${g}" data-v="${v}">${v}</button>`).join('')}</div></div>`).join('');body.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const k=b.dataset.g+'='+b.dataset.v;st.filters.has(k)?st.filters.delete(k):st.filters.add(k);renderFilters();render()});const n=st.filters.size;$('#selectedCount').textContent=n+' 项';$('#selectedCount').classList.toggle('show',n>0)}
function render(){const r=rows();$('#count').textContent=r.length;$('#status').textContent=st.kw?`搜索“${st.kw}”完成，共 ${r.length} 条 · 目标页面实时数据`:'输入型号后点击搜索；结果由目标页面接口实时获取';$('#list').innerHTML=r.length?r.map((d,i)=>{const extras=[d.dian,d.ji,d.wan,d.wan1,d.gong,d.gong1].filter(Boolean);return `<article class="card"><div class="head"><span class="idx">${i+1}</span><span class="name">${esc(d.nick||'未命名商品')}</span><span class="price"><small>￥</small>${esc(String(d.price??'暂无'))}</span></div><div class="tags"><span class="tag blue">${esc(d.report||'系统未知')}</span><span class="tag green">${memory(d)?memory(d)+'G':'内存未知'}</span>${d.score?`<span class="tag orange">${esc(d.score)}</span>`:''}${extras.map(x=>`<span class="tag ${tagClass(x)}">${esc(x)}</span>`).join('')}</div><div class="foot"><span>转转 · 由 wxhbts.com/zz.php 获取</span>${d.url?`<a class="open" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">打开链接 ↗</a>`:''}</div></article>`}).join(''):`<div class="empty"><b>⌕</b>暂无符合条件的结果<br><small>请调整型号或筛选条件</small></div>`;$('#end').textContent=r.length?'—— 共 '+r.length+' 条 ——':'';document.querySelectorAll('.sort').forEach(b=>{b.classList.toggle('active',b.dataset.sort===st.sort);const e=b.querySelector('em');if(e)e.textContent=b.dataset.sort===st.sort&&st.dir?(st.dir===1?'↑':'↓'):''})}
async function search(){const kw=$('#kw').value.trim();if(!kw){$('#status').textContent='请先输入型号，例如 iPhone 15';return}st.kw=kw;const pages=Math.max(1,Math.min(50,Number($('#pages').value)||1));$('#dot').classList.add('busy');$('#status').textContent='正在从目标页面获取数据…';try{const res=await fetch(`/api/search?kw=${encodeURIComponent(kw)}&pages=${pages}`);const data=await res.json();if(!res.ok)throw new Error(data.error||'请求失败');st.rows=data.items||[];st.sort='default';st.dir=0;st.filters.clear();renderFilters();render();$('#status').textContent=`加载完成：${st.rows.length} 条 · ${data.pages||pages} 页 · 来源 wxhbts.com/zz.php`}catch(e){st.rows=[];render();$('#status').textContent='获取失败：'+e.message+'；请稍后重试'}finally{$('#dot').classList.remove('busy')}}
$('#searchForm').onsubmit=e=>{e.preventDefault();search()};$('#reset').onclick=()=>{st.rows=[];st.kw='';st.sort='default';st.dir=0;st.filters.clear();$('#kw').value='';renderFilters();render()};$('#filter .filter-head').onclick=()=>$('#filter').classList.toggle('open');document.querySelectorAll('.sort').forEach(b=>b.onclick=()=>{const k=b.dataset.sort;if(k==='default'){st.sort='default';st.dir=0}else if(st.sort!==k){st.sort=k;st.dir=1}else st.dir=st.dir===1?-1:1;render()});renderFilters();render();
</script>
</body></html>
